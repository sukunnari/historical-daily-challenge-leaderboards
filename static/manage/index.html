<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Manage tracked players</title>
		<link rel="stylesheet" href="../assets/global.css?v=20260912" />
		<link rel="stylesheet" href="./manage.css?v=20260912" />
	</head>
	<body>
		<header class="header">
			<h1 class="header__title">Manage tracked players</h1>
		</header>
		<main>
			<noscript>Please enable JavaScript</noscript>
			<div class="card">
				<div class="card__title">Password</div>
				<div class="card__description">
					Please enter the password to make a valid request to the API
				</div>
				<form class="form-password" id="form-password">
					<input
						class="text-input-field"
						type="password"
						name="password"
						id="password"
						required
					/>
				</form>
			</div>
			<div class="card">
				<div class="card__title">Add a room</div>
				<form class="form-add-room" id="form-add-room">
					<input
						class="text-input-field"
						type="text"
						name="room-id"
						id="room-id"
						placeholder="Room ID"
						required
					/>
					<button type="submit" class="button-primary">Insert room</button>
				</form>
			</div>
			<div class="card">
				<div class="card__title">Retrieve scores for a room</div>
				<form class="form-add-room-scores" id="form-add-room-scores">
					<input
						class="text-input-field"
						type="text"
						name="room-id"
						id="room-id-for-scores"
						placeholder="Room ID"
						required
					/>
					<button type="submit" class="button-primary">Retrieve scores</button>
				</form>
			</div>
		</main>
	</body>
	<script src="./manage.js?v=20260913"></script>
</html>
